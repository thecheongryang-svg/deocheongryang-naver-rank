name: 더청량 네이버 순위 일일 체크

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC = 오전 9시 KST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: 순위 체크
        run: python daily_check.py

      - name: 정적 대시보드 데이터 생성
        run: python build_static_data.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 순위기록.csv docs/data
          git diff --quiet --cached || git commit -m "자동 순위 체크 $(date -u +%F)"
          git push
